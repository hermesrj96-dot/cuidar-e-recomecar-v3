<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | CUIDAR E RECOMEÇAR</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">CUIDAR E <b>RECOMEÇAR · ADMIN</b></a><a class="whats" href="/">Ver loja</a></header><main class="admin"><h1>Painel administrativo</h1><div id="msg" class="notice">Entre com a senha administrativa configurada no servidor.</div><section id="login" class="panel"><h2>Acesso restrito</h2><form id="loginForm"><input id="password" type="password" placeholder="Senha administrativa" required><button class="btn">Entrar</button></form></section><section id="dashboard" class="hidden"><div class="panel"><button id="logout" class="btn danger">Sair</button><h2>Cadastrar / editar produto</h2><form id="productForm"><input type="hidden" id="pid"><div class="formgrid"><input id="name" placeholder="Nome do produto" required><select id="category" required></select><input id="price" type="number" min="0" step="0.01" placeholder="Preço (R$)" required><input id="entry" type="number" min="0" step="0.01" placeholder="Entrada ilustrativa (opcional)"><input id="stock" type="number" min="0" step="1" placeholder="Estoque"><input id="image" type="url" placeholder="URL da imagem"><textarea id="description" placeholder="Descrição"></textarea></div><p><label><input id="active" type="checkbox" checked> Produto ativo</label> <label><input id="featured" type="checkbox"> Destaque</label></p><button class="btn">Salvar produto</button> <button type="button" id="clear" class="btn">Limpar</button></form></div><div class="panel"><h2>Catálogo</h2><div style="overflow:auto"><table><thead><tr><th>Produto</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="panel"><h2>Pedidos recebidos</h2><div style="overflow:auto"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Status</th><th>Atualizar</th></tr></thead><tbody id="orders"></tbody></table></div></div></section></main><script src="/admin.js"></script></body></html>
